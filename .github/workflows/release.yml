name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: package
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for os in darwin linux; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o dist/graft ./cmd/graft
              tar -C dist -czf "dist/graft_${ver}_${os}_${arch}.tar.gz" graft
              rm dist/graft
            done
          done
          (cd dist && sha256sum graft_*.tar.gz > checksums.txt)
          prev=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^")
          {
            echo '```sh'
            echo 'curl -fsSL https://raw.githubusercontent.com/akuma/graft/main/install.sh | sh'
            echo '```'
            echo
            git log --reverse --pretty='format:%s%n%n%b%n' "${prev}..HEAD" -- . ':!.github'
          } > dist/notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/graft_*.tar.gz dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/notes.md

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: build
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="graft_${ver}_${os}_${arch}"
            mkdir -p "dist/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "dist/${name}/graft" ./cmd/graft
            tar -C "dist/${name}" -czf "dist/${name}.tar.gz" graft
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
            --title "$GITHUB_REF_NAME" \
            --notes "curl -fsSL https://raw.githubusercontent.com/akuma/graft/main/install.sh | sh"
